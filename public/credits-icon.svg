<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="creditCoin" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Back coin (upper-left) -->
  <g transform="translate(22 22) rotate(-20)" stroke="url(#creditCoin)" stroke-width="3.6" stroke-linecap="round" fill="none">
    <circle cx="0" cy="0" r="14" stroke-dasharray="74 14" />
    <circle cx="0" cy="0" r="8.5" stroke-dasharray="44 9" />
  </g>
  <!-- Front coin (lower-right) -->
  <g transform="translate(42 42) rotate(25)" stroke="url(#creditCoin)" stroke-width="3.6" stroke-linecap="round" fill="none">
    <circle cx="0" cy="0" r="16" stroke-dasharray="84 16" />
    <circle cx="0" cy="0" r="9.5" stroke-dasharray="50 10" />
  </g>
</svg>
